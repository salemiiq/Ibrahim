<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مطعم إبراهيم</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #111;
      color: #FFD700;
      text-align: center;
    }
    header img {
      width: 150px;
      height: 150px;
      object-fit: contain;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0.5em 0;
    }
    .menu img {
      width: 90%;
      max-width: 600px;
      border-radius: 20px;
      margin: 10px auto;
      display: block;
    }
    footer {
      margin-top: 40px;
    }
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    .social-icons a img {
      width: 50px;
      height: 50px;
      transition: transform 0.2s ease, filter 0.3s ease;
    }
    .social-icons a img:hover {
      transform: scale(1.1);
      filter: brightness(1.2);
    }
  </style>
</head>
<body>
  <header>
    <img src="https://i.imgur.com/FcBYy7R.png" alt="لوقو المطعم">
    <h1>مرحباً بكم في مطعم إبراهيم للبرغر</h1>
  </header>

  <section class="menu">
    <img src="https://i.imgur.com/tCB6Wg4.png" alt="منيو 1">
    <img src="https://i.imgur.com/OfG5yex.png" alt="منيو 2">
  </section>

  <footer>
    <div class="social-icons">
      <a href="https://chat.whatsapp.com/CyNCO1FjtdzGhAxoF3bl2V" target="_blank">
        <img src="https://i.imgur.com/BeMFuRj.png" alt="واتساب">
      </a>
      <a href="https://www.instagram.com/salem.iso?igsh=NnBycDhieDNoMGZ3&utm_source=qr" target="_blank">
        <img src="https://i.imgur.com/Ww2H5Ij.png" alt="إنستغرام">
      </a>
    </div>
  </footer>
</body>
</html>
